name: CI

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '.github/workflows/ci.yml'
      - 'package.json'
  pull_request:
    branches: [main]
    paths:
      - '**'
      - '.github/workflows/ci.yml'
      - 'package.json'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.16.0
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint